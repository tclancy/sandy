[project]
name = "sandy"
version = "0.1.0"
description = "CLI tool that routes text commands to plugins"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "aiohttp>=3.14.3",
    "slack-bolt>=1.30.0",
    "spotipy>=2.26.0",
    "pylast>=7.1.0",
    "pychromecast>=14.0.10",
    "sentry-sdk>=2.68.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sandy --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
markers = [
    "real_voice: opt out of the autouse voice silencer in tests/conftest.py",
]

[tool.coverage.run]
source = ["sandy"]
omit = ["sandy/plugins/__init__.py", "sandy/__init__.py"]

[tool.ruff]
line-length = 100
# Honour the exclusions below even when a file is named explicitly on the command
# line. Without this, `ruff format README.md` -- or an editor's format-on-save
# against an open Markdown file -- rewrites the very docs the exclude protects,
# because ruff treats an explicit path as an override of its discovery rules.
force-exclude = true

[tool.ruff.format]
# ruff 0.16.0 started formatting Python code blocks inside Markdown files. The
# bump arrived as a routine Dependabot patch (0.15.22 -> 0.16.0, d856864) and
# silently widened the formatter's scope from our source to our prose: five docs
# nobody had edited in weeks began failing CI's `ruff format --check .`, and
# `main` was red for a day (sandy#159).
#
# We opt back out rather than reformat the docs, because what the formatter wants
# to do to them is a net loss: it collapses README's deliberately aligned comment
# column, injects blank lines into illustrative fragments, and rewrites dated
# planning records under docs/plans/ that are historical documents, not source.
#
# This is a scope decision, not a style one -- flip it (drop the exclude below,
# run `uv run ruff format .`) if we ever decide docs *should* be formatter-owned.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[project.scripts]
sandy = "sandy.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
]
