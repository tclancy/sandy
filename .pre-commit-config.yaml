repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # ruff runs from THIS project's environment, not from a rev-pinned copy of
      # astral-sh/ruff-pre-commit. That hook installs its tag's own ruff into an
      # isolated env, which is a second version of the linter that has to be kept
      # in lockstep with uv.lock by hand — and Dependabot treats `pip` and
      # `pre-commit` as separate ecosystems, so a ruff release arrives as two PRs
      # that cannot land atomically. The agreement test went red on each of them
      # in turn, roughly weekly (#166). Sourcing the binary from uv.lock makes
      # the skew impossible instead of merely detected.
      #
      # --frozen, not --locked: a bare `uv run` re-resolves against PyPI and
      # rewrites the tracked uv.lock as a side effect, which pre-commit then
      # fails as "files were modified by this hook"; --locked would instead abort
      # the commit on a stale lock. Hooks want --frozen, CI wants --locked, and
      # .github/workflows/ci.yml carries the latter.
      #
      # types_or mirrors what astral-sh/ruff-pre-commit declared, so the file set
      # is unchanged by this swap. Note it excludes Markdown at every ruff
      # version — the 0.16.0 Markdown-discovery break (#159) is covered by
      # `[tool.ruff.format] exclude` plus tests/test_ruff_format_scope.py, not
      # by anything here.
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: pytest-cov
        name: pytest (with coverage)
        # --frozen: a bare `uv run` re-resolves against PyPI and rewrites the
        # tracked uv.lock as a side effect. pre-commit fails any hook that
        # modifies a file, so every commit died on "files were modified by
        # this hook" with all tests green. Honouring the committed lock is
        # also what we want on principle — the hook should test the pinned
        # dependency set, not whatever resolved fresh this minute.
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
