repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # ruff runs from THIS project's environment, not from a rev-pinned copy of
      # astral-sh/ruff-pre-commit. That hook installs its tag's own ruff into an
      # isolated env, which is a second version of the linter that has to be kept
      # in lockstep with uv.lock by hand — and Dependabot treats `pip` and
      # `pre-commit` as separate ecosystems, so a ruff release arrives as two PRs
      # that cannot land atomically. The agreement test went red on each of them
      # in turn, roughly weekly (#166). Sourcing the binary from uv.lock makes
      # the skew impossible instead of merely detected.
      #
      # --frozen, not --locked: a bare `uv run` re-resolves against PyPI and
      # rewrites the tracked uv.lock as a side effect, which pre-commit then
      # fails as "files were modified by this hook"; --locked would instead abort
      # the commit on a stale lock. Hooks want --frozen, CI wants --locked, and
      # .github/workflows/ci.yml carries the latter.
      #
      # types_or and --force-exclude are copied from astral-sh/ruff-pre-commit's
      # own .pre-commit-hooks.yaml at v0.16.0, so the file set is unchanged by
      # this swap. Both matter and both are now OURS to keep — under the old
      # arrangement they came from upstream and could not be lost locally.
      #
      # --force-exclude is the load-bearing one: pre-commit passes filenames
      # explicitly, and ruff treats an explicit path as an override of its
      # discovery rules unless told otherwise. Without it these hooks would
      # reformat the very Markdown that `[tool.ruff.format] exclude` protects —
      # i.e. the #159 breakage, re-armed. pyproject.toml also sets
      # `force-exclude = true`, so today this flag is belt-and-braces; it is
      # spelled out anyway because that pyproject line is documented as
      # protection against editors and manual runs, and a future reader tidying
      # it would silently take the hooks down with it.
      #
      # (types_or excludes Markdown at every ruff version, so it is not what
      # covers #159 — tests/test_ruff_format_scope.py runs the whole-tree check.)
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: pytest-cov
        name: pytest (with coverage)
        # --frozen: a bare `uv run` re-resolves against PyPI and rewrites the
        # tracked uv.lock as a side effect. pre-commit fails any hook that
        # modifies a file, so every commit died on "files were modified by
        # this hook" with all tests green. Honouring the committed lock is
        # also what we want on principle — the hook should test the pinned
        # dependency set, not whatever resolved fresh this minute.
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
