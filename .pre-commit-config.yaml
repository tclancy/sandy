repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest (with coverage)
        # --frozen: a bare `uv run` re-resolves against PyPI and rewrites the
        # tracked uv.lock as a side effect. pre-commit fails any hook that
        # modifies a file, so every commit died on "files were modified by
        # this hook" with all tests green. Honouring the committed lock is
        # also what we want on principle — the hook should test the pinned
        # dependency set, not whatever resolved fresh this minute.
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
