name: Claude Code Review

# Steady-state burn reduction (#320 §5):
#   - Auto-trigger on `opened` only (was: opened + synchronize). A 10-commit PR
#     used to fire 10 model reviews; now it fires one. Re-review on demand by
#     leaving a comment containing `/review` (or `@claude review`).
#   - Skip Dependabot and `chore` PRs entirely (closes #314).

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-sandy-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. Concurrency cancellation happens when a run is *created*,
  # before job-level `if` filtering — so with cancel-in-progress: true, ANY
  # comment on the PR (including the review's own `gh pr comment`) spawned an
  # issue_comment run in this group and cancelled the in-flight review job.
  # Every pull_request-triggered review self-cancelled seconds after posting.
  # The superseded-review case this once guarded (re-review on push) died when
  # #320 dropped the `synchronize` trigger; queueing is always correct now.
  cancel-in-progress: false

jobs:
  claude-review:
    # Run when:
    #   - PR opened by a non-Dependabot author with a non-`chore` title, OR
    #   - a comment on a PR explicitly asks for `/review` or `@claude review`.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !startsWith(github.event.pull_request.title, 'chore'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '/review')
            || contains(github.event.comment.body, '@claude review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      # Without this the three mcp__github_ci__* tools stay in the resolved
      # allowedTools while their MCP server was never registered — the
      # track_progress trap below, in reverse. Every call to them is then an
      # automatic denial, and denials burn turns against --max-turns. It also
      # gives the reviewer a way to READ CI status, which is the cheap
      # alternative to it trying to run the test suite itself (see the prompt).
      actions: read

    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            number="${{ github.event.issue.number }}"
            sha="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.sha)"
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.sha }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'metaframework-dispatch-bot'
          # REQUIRED to post inline comments, and the non-obvious one.
          # `--allowed-tools` only FILTERS already-registered MCP servers; it does
          # not register them. Without track_progress the github_inline_comment
          # server never connects, so the inline-comment tool is denied even when
          # it is correctly allow-listed — the model burns turns retrying and the
          # job exits `success` having posted nothing. That was run 30504269713:
          # authenticated fine, initialized on claude-sonnet-5, logged
          # `No buffered inline comments`, left zero comments on PR #162.
          track_progress: true
          # Defaults to true, and has documented buffering bugs when enabled --
          # the upstream examples/pr-review-comprehensive.yml omits it. Pinned
          # off explicitly so a default change upstream can't silently reintroduce
          # the empty-buffer failure above.
          classify_inline_comments: false
          prompt: |
            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.
            Be constructive and specific.

            Do NOT run the test suite, linters, or any build step. The `ci`
            workflow already does that on this same commit, and this job has no
            dependencies installed — every attempt is a denied tool call that
            costs a turn and returns nothing. Read the results with
            mcp__github_ci__get_ci_status instead.

            Post findings that point at specific lines with
            mcp__github_inline_comment__create_inline_comment. Use `gh pr comment`
            for the overall summary, or for findings with no single line to anchor
            to. Say so in the summary if you find nothing worth flagging, so a
            silent pass is distinguishable from a broken run.
          # mcp__github_inline_comment__create_inline_comment must be listed here
          # AND registered by track_progress above -- both, or inline comments
          # silently no-op. --max-turns bounds the blast radius: an unposted
          # finding otherwise retries until the turn limit, burning Actions
          # minutes on a job that produces nothing (the account has exhausted its
          # included minutes two months running).
          #
          # TodoWrite is allow-listed because the `claude_code` preset system
          # prompt drives a todo list on any multi-step task, and a code review
          # is exactly that shape — without it every such call is denied.
          #
          # --max-turns was 25 and the gate was starving on it. Turn/denial
          # counts from the result JSON of the last three runs:
          #   Jul 30 run 30584453644  success        20 turns   6 denials
          #   Jul 31 run 30602662980  error_max_turns 26 turns 13 denials
          #   Jul 31 run 30634296456  error_max_turns 26 turns  9 denials
          # 40 restores headroom. The denials are the actual defect and are
          # addressed above; the ceiling is the safety margin, not the fix. If
          # permission_denials_count does not drop to ~0 on the next run, the
          # remaining denials are unidentified — the action hides the tool
          # stream, so re-run with `show_full_output: true` to name them.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,TodoWrite,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)" --max-turns 40'
