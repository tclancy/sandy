name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.13

      # --locked, not a bare sync: without it uv re-resolves against PyPI and can
      # install a ruff that is not in the committed lockfile, which would make the
      # pre-commit hooks' "uv.lock is the single ruff pin" guarantee true of the
      # file and false of this machine (#166). --locked fails the build on a stale
      # lock rather than silently repairing it, which is what CI wants; the hooks
      # use --frozen for the opposite reason.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test with coverage
        run: uv run pytest
