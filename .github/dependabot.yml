version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Kept, but no longer for ruff. This ecosystem was added under #161 to chase
  # the astral-sh/ruff-pre-commit rev; #166 deleted that block, so ruff now moves
  # only via `pip` above. What is left here is pre-commit-hooks, the one
  # third-party repo still pinned at a rev in .pre-commit-config.yaml — and the
  # pip ecosystem cannot see that file. Drop this entry if that last pinned repo
  # ever goes away; tests/test_toolchain_pins.py derives the requirement from
  # the config rather than hardcoding it, so it will not object.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
